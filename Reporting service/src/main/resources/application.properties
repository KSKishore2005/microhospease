# Service Identity and Port
spring.application.name=reporting-service
server.port=8082

# Database Configuration
# allowPublicKeyRetrieval=true is often needed for modern MySQL connections
spring.datasource.url=jdbc:mysql://localhost:3306/hospease_reporting?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=7558174236@Aa
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Hibernate Settings
# Change to 'update' so you don't lose data on every restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Discovery Client
# This is correct for connecting to your Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.enabled=true


# Actuator for Health Checks
# Required so Gateway and Eureka know your service is alive
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger OpenAPI 3.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# SQL Script Execution
# 'always' will run your data.sql every time the app starts
spring.sql.init.mode=always
# Defer ensures tables exist before the script runs
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=false

report.storage.path=./reports/