server:
  port: 8765

spring:
  application:
    name: api-gateway

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    gateway:
      routes:
        - id: reporting-service-route
          uri: lb://REPORTING-SERVICE
          predicates:
            - Path=/api/reports/**, /api/kpis/**, /api/audit-packages/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/