# ──────────────────────────────────────────────────────────────────────────────
# HospEase - Reporting Service Externalized Configuration
# Served by Config Server (port 8888) using native profile
# ──────────────────────────────────────────────────────────────────────────────

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/reporting_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Init
spring.sql.init.mode=never

# JWT Secret
app.jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007}

# Feign Timeouts
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Feign Circuit Breaker (enables fallback wiring on @FeignClient)
feign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.enabled=true

# ── Resilience4j Circuit Breaker ──────────────────────────────────────────────
resilience4j.circuitbreaker.instances.finance-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.finance-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.finance-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.finance-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.finance-service.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.room-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.room-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.room-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.room-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.room-service.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.guest-reservation-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.guest-reservation-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.guest-reservation-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.guest-reservation-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.guest-reservation-service.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.service-order-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.service-order-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.service-order-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.service-order-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.service-order-service.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.user-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.user-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.user-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.user-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.user-service.registerHealthIndicator=true

# ── Resilience4j Rate Limiter ──────────────────────────────────────────────────
resilience4j.ratelimiter.instances.reportGeneration.limitForPeriod=5
resilience4j.ratelimiter.instances.reportGeneration.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.reportGeneration.timeoutDuration=0s
resilience4j.ratelimiter.instances.reportGeneration.registerHealthIndicator=true

resilience4j.ratelimiter.instances.kpiCalculation.limitForPeriod=10
resilience4j.ratelimiter.instances.kpiCalculation.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.kpiCalculation.timeoutDuration=0s
resilience4j.ratelimiter.instances.kpiCalculation.registerHealthIndicator=true

# Downstream Service Fallback URLs
user-service.url=http://localhost:8084
room-service.url=http://localhost:8082
guest-reservation-service.url=http://localhost:8083
service-order-service.url=http://localhost:8085
finance-service.url=http://localhost:8086

# Report PDF Storage
report.storage.path=${REPORT_STORAGE_PATH:./reports/}
