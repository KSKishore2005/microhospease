server:
  port: 8088
  # Bind to loopback so external callers can't bypass the gateway (S-C2).
  # Override with SERVICE_BIND_ADDR=0.0.0.0 for prod with firewalled networks.
  address: ${SERVICE_BIND_ADDR:127.0.0.1}

spring:
  application:
    name: reporting-service

  # ── Config Server ─────────────────────────────────────────────────────────────
  # Fetches reporting-service.properties from config-server (port 8888)
  # "optional:" means the service still starts if config server is unavailable
  config:
    import: "optional:configserver:http://localhost:8888"

  # ── Local Fallback Config (used if config server is unavailable) ───────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reporting_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false

  sql:
    init:
      mode: never

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

# JWT secret no longer needed — gateway is the only validator. Removed (S-H2).

# ── Downstream Service Fallback URLs ─────────────────────────────────────────
user-service:
  url: http://localhost:8084
room-service:
  url: http://localhost:8082
guest-reservation-service:
  url: http://localhost:8083
service-order-service:
  url: http://localhost:8085
finance-service:
  url: http://localhost:8086

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # Match server.address so gateway → service discovery resolves to a reachable host.
    ip-address: ${SERVICE_BIND_ADDR:127.0.0.1}

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

# ── Swagger ───────────────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── Report PDF Storage (fallback) ─────────────────────────────────────────────
report:
  storage:
    path: ${REPORT_STORAGE_PATH:./reports/}

# ── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j:

  # Circuit Breaker — one instance per downstream service
  circuitbreaker:
    instances:
      finance-service:
        # Open circuit after 50% failures in a window of 10 calls
        slidingWindowSize: 10
        failureRateThreshold: 50
        # Stay open for 10s before moving to HALF-OPEN
        waitDurationInOpenState: 10s
        # Allow 3 test calls in HALF-OPEN state
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      room-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      guest-reservation-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      service-order-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      user-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true

  # Rate Limiter — limits burst of expensive report/KPI generation requests
  ratelimiter:
    instances:
      # Report create/update — max 5 requests per 10 seconds
      reportGeneration:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0s
        registerHealthIndicator: true
      # KPI calculations — max 10 requests per 10 seconds
      kpiCalculation:
        limitForPeriod: 10
        limitRefreshPeriod: 10s
        timeoutDuration: 0s
        registerHealthIndicator: true
