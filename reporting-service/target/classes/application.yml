server:
  port: 8088

spring:
  application:
    name: reporting-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reporting_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  sql:
    init:
      mode: never

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

# JWT secret (root level - NOT inside spring)
app:
  jwt:
    secret: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007

# Fallback URLs (used when Eureka can't resolve names)
user-service:
  url: http://localhost:8084
room-service:
  url: http://localhost:8082
guest-reservation-service:
  url: http://localhost:8083
service-order-service:
  url: http://localhost:8085
finance-service:
  url: http://localhost:8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

report:
  storage:
    path: ${REPORT_STORAGE_PATH:./reports/}