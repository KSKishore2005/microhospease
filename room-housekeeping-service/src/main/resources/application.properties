# App name must be 'room-service' so Feign Client can find it
spring.application.name=room-service

# Server Port
server.port=8082
# Bind to loopback so external callers can't bypass the gateway and hit this
# service directly (S-C2). For prod with services on different hosts, set
# SERVICE_BIND_ADDR=0.0.0.0 and rely on firewall rules + the X-Gateway-Secret
# pattern instead.
server.address=${SERVICE_BIND_ADDR:127.0.0.1}

# Config Server
spring.config.import=optional:configserver:http://localhost:8888

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/room_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run schema.sql AFTER Hibernate creates the tables on startup. The script
# applies idempotent ALTER TABLE statements that widen columns Hibernate
# cannot resize on its own (see schema.sql for the staff.role truncation bug).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Jackson – serialize dates as ISO-8601 strings, not timestamp arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Register with the loopback so the gateway (which uses Eureka to discover
# us) reaches us at the same address we're bound to. Must match server.address.
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_BIND_ADDR:127.0.0.1}

# Actuator endpoints (used by Eureka health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
