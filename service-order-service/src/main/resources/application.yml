server:
  port: 8085
  # Bind to loopback so external callers can't bypass the gateway (S-C2).
  # Override with SERVICE_BIND_ADDR=0.0.0.0 for prod deployments with firewalled networks.
  address: ${SERVICE_BIND_ADDR:127.0.0.1}

# JWT secret no longer needed — gateway is the only validator. Removed (S-H2).

spring:
  application:
    name: service-order-service

  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:mysql://localhost:3306/services_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false

  # IMPORTANT: schema.sql/data.sql disabled. Hibernate handles the schema via ddl-auto.
  # Re-enable only if you want to seed sample data; data.sql will run on every startup.
  sql:
    init:
      mode: never

  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000

# Fallback URLs (used by Feign only when Eureka can't resolve the service name)
guest-reservation-service:
  url: http://localhost:8083
room-service:
  url: http://localhost:8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # Match server.address so gateway → service discovery resolves to a
    # reachable host. If you change server.address, change this too.
    ip-address: ${SERVICE_BIND_ADDR:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
